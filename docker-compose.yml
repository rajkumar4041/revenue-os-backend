services:
  db:
    image: postgres:16
    container_name: revenueos-db
    environment:
      POSTGRES_DB: revenueos
      POSTGRES_USER: revenueos
      POSTGRES_PASSWORD: revenueos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueos -d revenueos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: revenueos-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/revenueos
      DB_USERNAME: revenueos
      DB_PASSWORD: revenueos
    ports:
      - "8080:8080"

volumes:
  pgdata:
