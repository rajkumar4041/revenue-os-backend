spring:
  application:
    name: revenue-os-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/revenueos}
    username: ${DB_USERNAME:revenueos}
    password: ${DB_PASSWORD:revenueos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: revenue-os
    # Base64 256-bit secret. MUST be overridden in production via JWT_SECRET.
    secret: ${JWT_SECRET:ZGV2LW9ubHktY2hhbmdlLW1lLXJldmVudWVvcy1qd3Qtc2lnbmluZy1zZWNyZXQtMjU2Yml0}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  security:
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
