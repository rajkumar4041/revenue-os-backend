spring:
  datasource:
    url: jdbc:h2:mem:revenueos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    issuer: revenue-os-test
    secret: ZGV2LW9ubHktY2hhbmdlLW1lLXJldmVudWVvcy1qd3Qtc2lnbmluZy1zZWNyZXQtMjU2Yml0
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  security:
    password-reset-ttl: PT30M
  cors:
    allowed-origins: http://localhost:5173
